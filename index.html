<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff6eb4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="推しカレ">
<title>推しカレンダー</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  background:linear-gradient(135deg,#0d0b1e 0%,#1a0a2e 40%,#0d1a3a 100%);
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','YuGothic',sans-serif;
  color:#e8e0ff;min-height:100vh;
}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.8;transform:scale(1.5)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes floatUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 10px 3px rgba(255,110,180,.5)}50%{box-shadow:0 0 22px 6px rgba(124,106,255,.7)}}

/* stars */
.star{position:fixed;border-radius:50%;background:#fff;pointer-events:none;z-index:0}

/* buttons */
.btn{cursor:pointer;font-family:inherit;transition:all .18s;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.94)!important}

/* layout */
.app-wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 12px 32px}
.two-col{display:flex;gap:18px;padding-top:4px}
.main-area{flex:1;min-width:0}
.sidebar{width:260px;flex-shrink:0}
@media(max-width:640px){
  .two-col{flex-direction:column}
  .sidebar{width:100%}
  .sidebar-box{display:none!important}
  .mobile-upcoming{display:block!important}
}
@media(min-width:641px){
  .mobile-upcoming{display:none!important}
}

/* calendar cells */
.day-cell{min-height:64px;border-radius:9px;border:1px solid transparent;
  padding:5px 3px 3px;cursor:pointer;transition:all .18s;position:relative}
.day-cell:hover{background:rgba(255,110,180,.1)!important;border-color:rgba(255,110,180,.35)!important;transform:scale(1.03)}
@media(max-width:640px){.day-cell{min-height:50px}}
@media(max-width:380px){.day-cell{min-height:42px}}

/* inputs */
input,select,textarea{
  background:rgba(255,255,255,.06)!important;
  border:1px solid rgba(255,110,180,.3)!important;
  color:#e8e0ff!important;border-radius:8px!important;
  padding:10px 12px!important;font-size:16px!important;
  width:100%;outline:none;font-family:inherit;
  -webkit-appearance:none;appearance:none;
}
input:focus,select:focus,textarea:focus{
  border-color:rgba(255,110,180,.7)!important;
  box-shadow:0 0 0 3px rgba(255,110,180,.1)!important
}
select option{background:#1a0a2e;color:#e8e0ff}
textarea{resize:vertical;min-height:64px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:16px;animation:floatUp .2s ease}
.modal-box{
  background:linear-gradient(135deg,#1a0f30,#0d1428);
  border-radius:20px;padding:22px;width:100%;
  max-height:90vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:floatUp .22s ease;
}

/* scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(255,110,180,.35);border-radius:4px}

/* safe area for notch */
.bottom-pad{height:env(safe-area-inset-bottom,0px)}

/* pwa install banner */
#install-banner{
  display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:linear-gradient(90deg,#ff6eb4,#c77dff);
  color:#fff;border-radius:30px;padding:12px 24px;
  font-weight:700;font-size:13px;z-index:300;
  box-shadow:0 4px 20px rgba(255,110,180,.5);
  cursor:pointer;border:none;font-family:inherit;
  white-space:nowrap;
}
</style>
</head>
<body>

<div id="root"></div>
<button id="install-banner" onclick="installPWA()">📲 ホーム画面に追加</button>

<script>
// ── PWA install prompt ──────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').style.display = 'block';
});
function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  });
}
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').style.display = 'none';
});

// ── Service Worker ──────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('./sw.js').catch(() => {})
  );
}

// ── Constants ──────────────────────────────────────────
const CATEGORIES = [
  {id:'anime', label:'アニメ', color:'#ff6eb4', icon:'✨'},
  {id:'game',  label:'ゲーム', color:'#7c6aff', icon:'🎮'},
  {id:'manga', label:'漫画',   color:'#ff9d3d', icon:'📖'},
  {id:'vtuber',label:'VTuber',color:'#00d4b4', icon:'🌟'},
  {id:'music', label:'音楽',   color:'#ff4466', icon:'🎵'},
  {id:'other', label:'その他', color:'#a0a0c0', icon:'💫'},
];
const EVENT_TYPES = [
  {id:'birthday',    label:'誕生日',   emoji:'🎂'},
  {id:'anniversary', label:'記念日',   emoji:'🎊'},
  {id:'release',     label:'発売日',   emoji:'📦'},
  {id:'event',       label:'イベント', emoji:'🎉'},
];
const SAMPLE = [
  {id:1, name:'竈門炭治郎',         date:'07-14', type:'birthday',    category:'anime',  group:'鬼滅の刃',  note:'主人公！家族想いの優しい子'},
  {id:2, name:'ホグワーツ・レガシー', date:'02-10', type:'release',     category:'game',   group:'',          note:'魔法世界を冒険'},
  {id:3, name:'推しの子 連載開始',   date:'04-12', type:'anniversary', category:'manga',  group:'推しの子',  note:'赤坂アカ先生'},
  {id:4, name:'五条悟',             date:'12-07', type:'birthday',    category:'anime',  group:'呪術廻戦',  note:'最強の術師'},
  {id:5, name:'禪院真希',           date:'01-20', type:'birthday',    category:'anime',  group:'呪術廻戦',  note:'炎髪の強キャラ'},
];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DAYS   = ['日','月','火','水','木','金','土'];

const pad  = n => String(n).padStart(2,'0');
const mKey = m => pad(m+1);
const catOf = id => CATEGORIES.find(c=>c.id===id);
const etOf  = id => EVENT_TYPES.find(t=>t.id===id);

// ── State ──────────────────────────────────────────────
const loadEvents = () => {
  try { const d = localStorage.getItem('oshi-events'); return d ? JSON.parse(d) : SAMPLE; }
  catch { return SAMPLE; }
};
const saveEvents = evs => {
  try { localStorage.setItem('oshi-events', JSON.stringify(evs)); } catch{}
};

const today = new Date();
let state = {
  events: loadEvents(),
  year:   today.getFullYear(),
  month:  today.getMonth(),
  view:   'calendar',
  filter: 'all',
  groupFilter: 'all',
  selDay: null,
  showDetail: false,
  showAdd:    false,
  glowDay: null,
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ── Stars (generated once) ─────────────────────────────
const STARS = Array.from({length:55},(_,i)=>({
  id:i,
  top:  (Math.random()*100).toFixed(1)+'%',
  left: (Math.random()*100).toFixed(1)+'%',
  size: (Math.random()*1.5+0.5).toFixed(2),
  delay:(Math.random()*4).toFixed(2),
}));

// ── Helpers ────────────────────────────────────────────
function matchesFilters(e) {
  return (state.filter==='all' || e.category===state.filter) &&
         (state.groupFilter==='all' || e.group===state.groupFilter);
}
function evForDay(d) {
  const key = `${mKey(state.month)}-${pad(d)}`;
  return state.events.filter(e => e.date===key && matchesFilters(e));
}
function getUpcoming() {
  return state.events
    .filter(matchesFilters)
    .map(e => {
      const [em,ed] = e.date.split('-').map(Number);
      const eDate = new Date(state.year, em-1, ed);
      const tDate = new Date(state.year, today.getMonth(), today.getDate());
      let diff = Math.floor((eDate - tDate)/86400000);
      if (diff < 0) diff += 365;
      return {...e, diff};
    })
    .sort((a,b)=>a.diff-b.diff)
    .slice(0,20);
}
function getGroups() {
  return [...new Set(state.events.map(e=>e.group).filter(Boolean))].sort();
}
function isToday(d) {
  return d===today.getDate() && state.month===today.getMonth() && state.year===today.getFullYear();
}
function getCells() {
  const days = new Date(state.year, state.month+1, 0).getDate();
  const first = new Date(state.year, state.month, 1).getDay();
  const cells = [...Array(first).fill(null), ...Array.from({length:days},(_,i)=>i+1)];
  while(cells.length%7) cells.push(null);
  return cells;
}

// ── Delete ─────────────────────────────────────────────
function deleteEv(id) {
  const events = state.events.filter(e=>e.id!==id);
  saveEvents(events);
  if (state.selDay) {
    const evs = state.selDay.evs.filter(e=>e.id!==id);
    if (!evs.length) setState({events, showDetail:false, selDay:null});
    else setState({events, selDay:{...state.selDay, evs}});
  } else {
    setState({events});
  }
}

// ── Add event (from form) ──────────────────────────────
function submitAdd() {
  const name  = document.getElementById('f-name').value.trim();
  const m     = parseInt(document.getElementById('f-m').value)||1;
  const d     = parseInt(document.getElementById('f-d').value)||1;
  const type  = document.getElementById('f-type').value;
  const cat   = document.getElementById('f-cat').value;
  const group = document.getElementById('f-group').value.trim();
  const note  = document.getElementById('f-note').value.trim();
  if (!name) { document.getElementById('f-name').focus(); return; }
  const catData = catOf(cat);
  const newEv = {id:Date.now(), name, date:`${pad(m)}-${pad(d)}`, type, category:cat, group, note, color:catData?.color||'#ff6eb4'};
  const events = [...state.events, newEv];
  saveEvents(events);
  setState({events, showAdd:false});
}

function setGroupQuick(g) {
  const el = document.getElementById('f-group');
  if (el) { el.value = g; el.dispatchEvent(new Event('input')); }
}

// ── Navigation ─────────────────────────────────────────
function prevMonth() {
  if(state.month===0) setState({month:11, year:state.year-1});
  else setState({month:state.month-1});
}
function nextMonth() {
  if(state.month===11) setState({month:0, year:state.year+1});
  else setState({month:state.month+1});
}
function clickDay(d) {
  const evs = evForDay(d);
  setState({glowDay:d});
  setTimeout(()=>setState({glowDay:null}),600);
  if (evs.length) setState({selDay:{d,evs}, showDetail:true});
}

// ── HTML builders ──────────────────────────────────────
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k==='style' && typeof v==='object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k==='className') el.className = v;
    else el.setAttribute(k, v);
  }
  for (const c of children) {
    if (c==null||c===false) continue;
    el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  }
  return el;
}
function frag(...children) {
  const f = document.createDocumentFragment();
  children.forEach(c => c && f.appendChild(typeof c==='string' ? document.createTextNode(c) : c));
  return f;
}

function buildStars() {
  const wrap = document.createDocumentFragment();
  STARS.forEach(s => {
    const el = document.createElement('div');
    el.className = 'star';
    el.style.cssText = `top:${s.top};left:${s.left};width:${s.size}px;height:${s.size}px;opacity:.35;animation:twinkle ${2+parseFloat(s.delay)}s ease-in-out infinite;animation-delay:${s.delay}s`;
    wrap.appendChild(el);
  });
  return wrap;
}

function buildCategoryFilter() {
  const items = [{id:'all',label:'すべて',color:'#c4b8e8',icon:''},...CATEGORIES];
  return h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'8px'}},
    ...items.map(cat =>
      h('button',{
        className:'btn',
        style:{
          padding:'4px 11px',borderRadius:'14px',border:'1px solid',fontSize:'11px',cursor:'pointer',
          fontFamily:'inherit',
          borderColor: state.filter===cat.id ? (cat.color||'#c4b8e8') : 'rgba(255,255,255,.1)',
          background:  state.filter===cat.id ? (cat.color||'#c4b8e8')+'28' : 'transparent',
          color:       state.filter===cat.id ? (cat.color||'#c4b8e8') : '#7a6fa0',
        },
        onclick: ()=>setState({filter:cat.id}),
      }, cat.icon+(cat.icon?' ':'')+cat.label)
    )
  );
}

function buildGroupFilter() {
  const groups = getGroups();
  if (!groups.length) return document.createDocumentFragment();
  const items = ['すべて',...groups];
  return h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'14px',alignItems:'center'}},
    h('span',{style:{fontSize:'10px',color:'#5a5070',letterSpacing:'.05em',flexShrink:'0'}},'グループ'),
    ...items.map((g,i) => {
      const isAll = i===0;
      const active = isAll ? state.groupFilter==='all' : state.groupFilter===g;
      return h('button',{
        className:'btn',
        style:{
          padding:'3px 10px',borderRadius:'12px',border:'1px solid',fontSize:'11px',cursor:'pointer',fontFamily:'inherit',
          borderColor: active ? (isAll?'rgba(200,180,255,.5)':'rgba(0,212,180,.5)') : 'rgba(255,255,255,.08)',
          background:  active ? (isAll?'rgba(200,180,255,.12)':'rgba(0,212,180,.12)') : 'transparent',
          color:       active ? (isAll?'#c4b8e8':'#00d4b4') : '#7a6fa0',
        },
        onclick: ()=>setState({groupFilter: isAll?'all':g}),
      }, isAll?'すべて':'📂 '+g);
    })
  );
}

function buildEventTag(ev) {
  const cat = catOf(ev.category);
  const el = document.createElement('div');
  el.style.cssText = `font-size:9px;padding:2px 4px;border-radius:4px;line-height:1.3;background:${(cat?.color||'#ff6eb4')}28;color:${cat?.color||'#ff6eb4'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis`;
  el.textContent = (etOf(ev.type)?.emoji||'🎉')+' '+ev.name;
  return el;
}

function buildUpcomingItem(ev, small) {
  const cat   = catOf(ev.category);
  const etype = etOf(ev.type);
  const [em,ed] = ev.date.split('-');
  const diffLabel = ev.diff===0?'🎊 今日':ev.diff<=7?`あと${ev.diff}日`:`${ev.diff}日後`;
  const diffColor = ev.diff===0?'#ff6eb4':ev.diff<=7?'#ffaa44':'#7a6fa0';

  return h('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'11px 0',borderBottom:'1px solid rgba(255,255,255,.04)'}},
    h('div',{style:{width:'36px',height:'36px',borderRadius:'10px',flexShrink:'0',
      background:(cat?.color||'#ff6eb4')+'22',border:`1px solid ${cat?.color||'#ff6eb4'}44`,
      display:'flex',alignItems:'center',justifyContent:'center',fontSize:'17px'}},
      etype?.emoji||'🎉'),
    h('div',{style:{flex:'1',minWidth:'0'}},
      h('div',{style:{fontWeight:'700',fontSize:'13px',color:'#f0e6ff',marginBottom:'2px',
        whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, ev.name),
      h('div',{style:{fontSize:'11px',color:'#7a6fa0',display:'flex',gap:'5px',flexWrap:'wrap',alignItems:'center'}},
        h('span',{style:{color:cat?.color}}, (cat?.icon||'')+' '+(cat?.label||'')),
        ev.group ? h('span',{style:{background:'rgba(0,212,180,.12)',color:'#00d4b4',borderRadius:'6px',padding:'1px 6px',fontSize:'10px'}},'📂 '+ev.group) : null,
        h('span',{},em+'月'+ed+'日')
      )
    ),
    h('div',{style:{fontSize:'11px',fontWeight:'800',flexShrink:'0',color:diffColor}}, diffLabel),
    h('button',{className:'btn',
      style:{background:'rgba(255,80,80,.08)',border:'1px solid rgba(255,80,80,.2)',color:'#ff8080',borderRadius:'6px',padding:'3px 7px',fontSize:'10px',flexShrink:'0',cursor:'pointer',fontFamily:'inherit'},
      onclick:()=>deleteEv(ev.id)}, '削除')
  );
}

function buildUpcomingList(limit) {
  const upcoming = getUpcoming().slice(0,limit||20);
  const wrap = document.createElement('div');
  if (!upcoming.length) {
    wrap.innerHTML = '<div style="padding:24px 0;text-align:center;color:#7a6fa0;font-size:13px">イベントがありません</div>';
  } else {
    upcoming.forEach(ev => wrap.appendChild(buildUpcomingItem(ev)));
  }
  return wrap;
}

function buildCalendarGrid(isMobile) {
  const cells = getCells();
  const wrap = h('div',{style:{background:'rgba(255,255,255,.03)',borderRadius:'18px',border:'1px solid rgba(255,110,180,.14)',backdropFilter:'blur(12px)',overflow:'hidden',animation:'floatUp .28s ease'}},
    // month nav
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 18px',borderBottom:'1px solid rgba(255,110,180,.1)'}},
      h('button',{className:'btn',style:{background:'rgba(255,110,180,.1)',border:'1px solid rgba(255,110,180,.2)',color:'#ff6eb4',borderRadius:'10px',padding:'6px 16px',fontSize:'20px',cursor:'pointer',fontFamily:'inherit'},onclick:prevMonth},'‹'),
      h('div',{style:{textAlign:'center'}},
        h('div',{style:{fontSize:isMobile?'18px':'22px',fontWeight:'800',color:'#f0e6ff'}}, state.year+'年 '+MONTHS[state.month]),
        h('div',{style:{fontSize:'11px',color:'#7a6fa0',marginTop:'2px'}},
          state.events.filter(e=>{const m=e.date.split('-')[0];return parseInt(m)===state.month+1&&(state.filter==='all'||e.category===state.filter);}).length+' 件')
      ),
      h('button',{className:'btn',style:{background:'rgba(255,110,180,.1)',border:'1px solid rgba(255,110,180,.2)',color:'#ff6eb4',borderRadius:'10px',padding:'6px 16px',fontSize:'20px',cursor:'pointer',fontFamily:'inherit'},onclick:nextMonth},'›')
    ),
    // day headers
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',padding:'0 8px'}},
      ...DAYS.map((d,i)=>h('div',{style:{textAlign:'center',padding:'8px 0',fontSize:'11px',fontWeight:'700',color:i===0?'#ff8888':i===6?'#88aaff':'#7a6fa0'}},d))
    ),
    // cells
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'2px',padding:'2px 8px 12px'}},
      ...cells.map((day,idx)=>{
        if (!day) return h('div',{style:{borderRadius:'9px'}});
        const evs = evForDay(day);
        const tod  = isToday(day);
        const cell = document.createElement('div');
        cell.className = 'day-cell btn';
        cell.style.borderColor = tod?'#ff6eb4':evs.length?'rgba(255,110,180,.2)':'transparent';
        cell.style.background  = tod?'rgba(255,110,180,.14)':evs.length?'rgba(255,255,255,.03)':'transparent';
        if (day===state.glowDay) cell.style.animation='glow .6s ease';
        cell.addEventListener('click',()=>clickDay(day));

        // day number
        const numWrap = document.createElement('div');
        numWrap.style.cssText=`text-align:center;font-size:${isMobile?'11px':'13px'};font-weight:${tod?800:500};color:${tod?'#ff6eb4':idx%7===0?'#ff9999':idx%7===6?'#99aaff':'#c4b8e8'};margin-bottom:2px`;
        if (tod) {
          const circle = document.createElement('span');
          circle.style.cssText='display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#ff6eb4;color:#fff;font-size:11px';
          circle.textContent=day;
          numWrap.appendChild(circle);
        } else {
          numWrap.textContent=day;
        }
        cell.appendChild(numWrap);

        if (!isMobile && evs.length) {
          const tagWrap = document.createElement('div');
          tagWrap.style.cssText='display:flex;flex-direction:column;gap:1px';
          evs.slice(0,2).forEach(ev=>tagWrap.appendChild(buildEventTag(ev)));
          if(evs.length>2){const more=document.createElement('div');more.style.cssText='font-size:9px;color:#7a6fa0;text-align:center';more.textContent=`+${evs.length-2}`;tagWrap.appendChild(more);}
          cell.appendChild(tagWrap);
        } else if (isMobile && evs.length) {
          const dot = document.createElement('div');
          const c = catOf(evs[0].category)?.color||'#ff6eb4';
          dot.style.cssText=`width:5px;height:5px;border-radius:50%;margin:0 auto;background:${c};box-shadow:0 0 4px ${c}`;
          cell.appendChild(dot);
        }
        return cell;
      })
    )
  );
  return wrap;
}

function buildDetailModal() {
  const {d, evs} = state.selDay;
  const close = ()=>setState({showDetail:false,selDay:null});
  const bg = h('div',{className:'modal-bg',onclick:close});
  const box = h('div',{className:'modal-box',style:{border:'1px solid rgba(255,110,180,.3)',maxWidth:'380px',boxShadow:'0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(255,110,180,.1)'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}},
      h('div',{},
        h('div',{style:{fontSize:'11px',color:'#7a6fa0'}},state.year+'年 '+(state.month+1)+'月'),
        h('div',{style:{fontSize:'22px',fontWeight:'800',color:'#f0e6ff'}},d+'日')
      ),
      h('button',{className:'btn',style:{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#7a6fa0',borderRadius:'10px',width:'32px',height:'32px',fontSize:'16px',cursor:'pointer',fontFamily:'inherit'},onclick:close},'×')
    ),
    h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}},
      ...evs.map(ev => {
        const cat=catOf(ev.category); const et=etOf(ev.type);
        const card = h('div',{style:{background:'rgba(255,255,255,.04)',borderRadius:'14px',padding:'13px',border:`1px solid ${cat?.color||'#ff6eb4'}30`,position:'relative'}},
          h('div',{style:{display:'flex',gap:'10px',alignItems:'flex-start'}},
            h('div',{style:{fontSize:'26px'}},et?.emoji||'🎉'),
            h('div',{style:{flex:'1'}},
              h('div',{style:{fontWeight:'700',fontSize:'14px',color:'#f0e6ff',marginBottom:'4px'}},ev.name),
              h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}},
                h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'8px',background:(cat?.color||'#ff6eb4')+'25',color:cat?.color||'#ff6eb4'}},(cat?.icon||'')+' '+(cat?.label||'')),
                h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'8px',background:'rgba(255,255,255,.06)',color:'#a090c0'}},et?.label||''),
                ev.group?h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'8px',background:'rgba(0,212,180,.12)',color:'#00d4b4'}},'📂 '+ev.group):null
              ),
              ev.note?h('div',{style:{fontSize:'12px',color:'#9080b0',marginTop:'5px'}},ev.note):null
            )
          ),
          h('button',{className:'btn',style:{position:'absolute',top:'10px',right:'10px',background:'rgba(255,80,80,.08)',border:'1px solid rgba(255,80,80,.2)',color:'#ff8080',borderRadius:'6px',padding:'2px 8px',fontSize:'11px',cursor:'pointer',fontFamily:'inherit'},onclick:()=>deleteEv(ev.id)},'削除')
        );
        return card;
      })
    )
  );
  box.addEventListener('click',e=>e.stopPropagation());
  bg.appendChild(box);
  return bg;
}

function buildAddModal() {
  const groups = getGroups();
  const close  = ()=>setState({showAdd:false});
  const bg = h('div',{className:'modal-bg',onclick:close});
  const box = h('div',{className:'modal-box',style:{border:'1px solid rgba(124,106,255,.35)',maxWidth:'420px',boxShadow:'0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(124,106,255,.1)'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'18px'}},
      h('div',{style:{fontSize:'17px',fontWeight:'800',color:'#c77dff'}},'✦ イベントを追加'),
      h('button',{className:'btn',style:{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#7a6fa0',borderRadius:'10px',width:'32px',height:'32px',fontSize:'16px',cursor:'pointer',fontFamily:'inherit'},onclick:close},'×')
    ),
    h('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}},
      // name
      h('div',{},
        h('label',{style:{fontSize:'12px',color:'#9080b0',display:'block',marginBottom:'4px'}},'推し・作品名 *'),
        h('input',{id:'f-name',placeholder:'例：五条悟',autocomplete:'off'})
      ),
      // date
      h('div',{},
        h('label',{style:{fontSize:'12px',color:'#9080b0',display:'block',marginBottom:'4px'}},'日付 *'),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr auto 1fr',alignItems:'center',gap:'6px'}},
          h('input',{id:'f-m',type:'number',min:'1',max:'12',placeholder:'月（1〜12）',inputmode:'numeric'}),
          h('span',{style:{color:'#7a6fa0',fontWeight:'700',textAlign:'center'}},'月'),
          h('input',{id:'f-d',type:'number',min:'1',max:'31',placeholder:'日（1〜31）',inputmode:'numeric'})
        ),
        h('div',{style:{fontSize:'10px',color:'#7a6fa0',marginTop:'3px'}},'毎年この日に繰り返しお祝い')
      ),
      // type + category
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}},
        h('div',{},
          h('label',{style:{fontSize:'12px',color:'#9080b0',display:'block',marginBottom:'4px'}},'種別'),
          h('select',{id:'f-type'},
            ...EVENT_TYPES.map(t=>h('option',{value:t.id},t.emoji+' '+t.label))
          )
        ),
        h('div',{},
          h('label',{style:{fontSize:'12px',color:'#9080b0',display:'block',marginBottom:'4px'}},'カテゴリ'),
          h('select',{id:'f-cat'},
            ...CATEGORIES.map(c=>h('option',{value:c.id},c.icon+' '+c.label))
          )
        )
      ),
      // group
      h('div',{},
        h('label',{style:{fontSize:'12px',color:'#9080b0',display:'block',marginBottom:'4px'}},
          'グループ',
          h('span',{style:{fontSize:'10px',color:'#5a5070',marginLeft:'6px'}},'作品・シリーズ・ユニット名など')
        ),
        h('input',{id:'f-group',placeholder:'例：呪術廻戦、にじさんじ、BTS…',list:'grp-list',autocomplete:'off'}),
        h('datalist',{id:'grp-list'},...groups.map(g=>h('option',{value:g}))),
        groups.length ? h('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap',marginTop:'5px'}},
          ...groups.map(g => h('button',{
            className:'btn',
            style:{padding:'2px 9px',borderRadius:'10px',border:'1px solid rgba(0,212,180,.3)',background:'rgba(0,212,180,.06)',color:'#5a8a80',fontSize:'11px',cursor:'pointer',fontFamily:'inherit'},
            onclick:()=>setGroupQuick(g)
          },'📂 '+g))
        ) : null
      ),
      // note
      h('div',{},
        h('label',{style:{fontSize:'12px',color:'#9080b0',display:'block',marginBottom:'4px'}},'メモ'),
        h('textarea',{id:'f-note',placeholder:'推しへの熱い気持ちを…'})
      ),
      // submit
      h('button',{className:'btn',
        style:{border:'none',borderRadius:'12px',padding:'13px',background:'linear-gradient(90deg,#ff6eb4,#c77dff)',color:'#fff',fontSize:'15px',fontWeight:'700',marginTop:'2px',cursor:'pointer',fontFamily:'inherit'},
        onclick:submitAdd
      },'✦ 登録する')
    )
  );
  box.addEventListener('click',e=>e.stopPropagation());
  bg.appendChild(box);
  return bg;
}

// ── Main render ────────────────────────────────────────
let starsInjected = false;
function render() {
  const isMobile = window.innerWidth <= 640;
  const groups   = getGroups();
  const upcoming = getUpcoming();

  const root = document.getElementById('root');
  root.innerHTML = '';

  // stars (once)
  if (!starsInjected) { root.appendChild(buildStars()); starsInjected=true; }

  const wrap = h('div',{className:'app-wrap'},
    // ── header
    h('div',{style:{textAlign:'center',padding:isMobile?'20px 0 12px':'28px 0 16px'}},
      h('div',{style:{fontSize:'11px',letterSpacing:'.35em',color:'#b4a0ff',marginBottom:'4px'}},'✦ ANNIVERSARY & BIRTHDAY ✦'),
      h('h1',{style:{fontSize:isMobile?'28px':'clamp(32px,5vw,46px)',fontWeight:'900',letterSpacing:'.04em',
        background:'linear-gradient(90deg,#ff6eb4,#c77dff,#7c6aff,#ff6eb4)',
        backgroundSize:'200% auto',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',
        animation:'shimmer 3s linear infinite'}},'推しカレンダー'),
      h('div',{style:{fontSize:'11px',color:'#7a6fa0',marginTop:'4px'}},'好きなキャラ・作品の大切な日を記録しよう')
    ),

    // ── controls
    h('div',{},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',gap:'8px'}},
        h('div',{style:{display:'flex',gap:'6px'}},
          ...['calendar','list'].map((v,i) => h('button',{className:'btn',
            style:{padding:'7px 16px',borderRadius:'18px',border:'1px solid',fontSize:'12px',cursor:'pointer',fontFamily:'inherit',
              borderColor: state.view===v?'#ff6eb4':'rgba(255,110,180,.2)',
              background:  state.view===v?'rgba(255,110,180,.16)':'transparent',
              color:       state.view===v?'#ff6eb4':'#7a6fa0',
              fontWeight:  state.view===v?'700':'400'},
            onclick:()=>setState({view:v})
          }, v==='calendar'?'📅 カレンダー':'📋 一覧'))
        ),
        h('button',{className:'btn',
          style:{padding:'7px 18px',borderRadius:'18px',border:'none',background:'linear-gradient(90deg,#ff6eb4,#c77dff)',color:'#fff',fontSize:'13px',fontWeight:'700',cursor:'pointer',fontFamily:'inherit'},
          onclick:()=>setState({showAdd:true})
        },'＋ 追加')
      ),
      buildCategoryFilter(),
      buildGroupFilter()
    ),

    // ── two-column layout
    h('div',{className:'two-col'},
      // main
      h('div',{className:'main-area'},
        state.view==='calendar'
          ? frag(
              buildCalendarGrid(isMobile),
              // mobile upcoming below calendar
              h('div',{className:'mobile-upcoming',style:{marginTop:'14px',background:'rgba(255,255,255,.03)',borderRadius:'18px',border:'1px solid rgba(255,110,180,.14)',overflow:'hidden'}},
                h('div',{style:{padding:'12px 16px',borderBottom:'1px solid rgba(255,110,180,.1)',fontWeight:'700',color:'#c77dff',fontSize:'13px'}},'⏳ 直近のイベント'),
                h('div',{style:{padding:'0 16px'}},buildUpcomingList(8))
              )
            )
          : h('div',{style:{background:'rgba(255,255,255,.03)',borderRadius:'18px',border:'1px solid rgba(255,110,180,.14)',overflow:'hidden',animation:'floatUp .28s ease'}},
              h('div',{style:{padding:'14px 18px',borderBottom:'1px solid rgba(255,110,180,.1)',fontWeight:'700',color:'#c77dff',fontSize:'14px'}},'⏳ 直近のイベント'),
              h('div',{style:{padding:'0 18px'}},buildUpcomingList(20))
            )
      ),
      // sidebar
      h('div',{className:'sidebar'},
        h('div',{className:'sidebar-box',style:{background:'rgba(255,255,255,.03)',borderRadius:'18px',border:'1px solid rgba(255,110,180,.14)',overflow:'hidden',position:'sticky',top:'16px'}},
          h('div',{style:{padding:'14px 16px',borderBottom:'1px solid rgba(255,110,180,.1)',fontWeight:'700',color:'#c77dff',fontSize:'14px'}},'⏳ 直近のイベント'),
          h('div',{style:{padding:'0 16px',maxHeight:'calc(100vh - 200px)',overflowY:'auto'}},buildUpcomingList(15))
        ),
        // category summary
        h('div',{className:'sidebar-box',style:{marginTop:'12px',display:'flex',flexWrap:'wrap',gap:'6px'}},
          ...CATEGORIES.map(cat=>{
            const cnt=state.events.filter(e=>e.category===cat.id).length;
            if(!cnt)return null;
            return h('div',{style:{padding:'4px 12px',borderRadius:'16px',fontSize:'11px',fontWeight:'600',background:cat.color+'14',border:`1px solid ${cat.color}38`,color:cat.color}},cat.icon+' '+cat.label+' '+cnt+'件');
          }).filter(Boolean)
        )
      )
    ),
    h('div',{className:'bottom-pad'})
  );

  root.appendChild(wrap);

  // modals
  if (state.showDetail && state.selDay) root.appendChild(buildDetailModal());
  if (state.showAdd) root.appendChild(buildAddModal());
}

// ── Boot ───────────────────────────────────────────────
window.addEventListener('resize', () => render());
render();
</script>
</body>
</html>
